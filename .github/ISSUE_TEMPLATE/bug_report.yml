name: 🐛 Relato de Bug
description: Crie um relato para nos ajudar a melhorar o SCM.
title: "[BUG] <título curto e descritivo>"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 🔴 Descrição do Bug
      description: Uma descrição clara e concisa sobre o que é o bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔴 Passos para reproduzir
      description: Como podemos chegar até o erro?
      placeholder: |
        1. Vá para '...'
        2. Clique em '....'
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 🔴 Comportamento esperado
      description: O que deveria ter acontecido?
    validations:
      required: true
