name: 🚀 Nova Funcionalidade
description: Sugira uma nova funcionalidade ou melhoria para o SCM.
title: "[FEATURE] <título curto e descritivo>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por sugerir uma melhoria para o SCM! Preencha os campos abaixo com o máximo de detalhes possível.
  - type: textarea
    id: description
    attributes:
      label: Descrição da funcionalidade
      description: Uma descrição clara e concisa do que você quer que seja implementado.
      placeholder: Eu gostaria de poder...
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Critérios de Aceite
      description: O que precisa acontecer para considerarmos essa funcionalidade pronta? (Use um checklist)
      placeholder: |
        - [ ] O usuário deve conseguir logar
        - [ ] A tela deve exibir erro se a senha for inválida
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Qual o escopo desta funcionalidade?
      options:
        - Frontend
        - Backend
        - Infraestrutura
        - Documentação
    validations:
      required: true
